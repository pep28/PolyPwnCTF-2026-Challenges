name: CI générique
on:
  pull_request:
  push:
    branches: [main, qa-branch]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  ci:
    uses: pep28/PolyPwnCTF-2026-Challenges/.github/workflows/challenge-ci.yml@d19d2a590de5a72784ec56e541ed57a9ddafe4fd

  validate:
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTAT: ${{ needs.ci.result }}
        run: test "$RESULTAT" = success

  docker-build:
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTAT: ${{ needs.ci.result }}
        run: test "$RESULTAT" = success

  compose-build:
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTAT: ${{ needs.ci.result }}
        run: test "$RESULTAT" = success
