name: Validate challenges

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Validate challenge.yml files
        run: python scripts/validate_challenges.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfiles
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            context="$(dirname "$file")"
            while [ "$context" != "." ] && [ ! -f "$context/challenge.yml" ]; do
              context="$(dirname "$context")"
            done
            if [ ! -f "$context/challenge.yml" ]; then
              context="$(dirname "$file")"
            fi
            echo "::group::Build $file (context: $context)"
            if ! docker build -f "$file" "$context"; then
              failed=1
              echo "::error file=$file::Docker build failed"
            fi
            echo "::endgroup::"
          done < <(find . -name Dockerfile -print0)
          exit "$failed"

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build Compose projects
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "::group::Compose $file"
            if ! docker compose -f "$file" config --quiet; then
              failed=1
              echo "::error file=$file::Compose configuration is invalid"
            elif ! docker compose -f "$file" up -d --build --wait --wait-timeout 90; then
              failed=1
              echo "::error file=$file::Compose services did not start and become ready"
              docker compose -f "$file" ps
              docker compose -f "$file" logs --no-color
            fi
            docker compose -f "$file" down --volumes --remove-orphans
            echo "::endgroup::"
          done < <(find . \( -name docker-compose.yml -o -name docker-compose.yaml -o -name compose.yml -o -name compose.yaml \) -print0)
          exit "$failed"
