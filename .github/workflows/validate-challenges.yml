name: Validate challenges

on:
  pull_request:
  push:
    branches:
      - main
      - qa-branch

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Validate challenge.yml files
        run: python scripts/validate_challenges.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build challenge Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' manifest; do
            dir="$(dirname "$manifest")"
            if [ -f "$dir/Dockerfile" ]; then
              echo "::group::Build $dir"
              docker build -f "$dir/Dockerfile" "$dir"
              echo "::endgroup::"
            fi
          done < <(find . -name challenge.yml -print0)

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build Compose projects
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "::group::Compose $file"
            if ! docker compose -f "$file" config --quiet; then
              failed=1
              echo "::error file=$file::Compose configuration is invalid"
            elif ! config="$(docker compose -f "$file" config --format json)"; then
              failed=1
              echo "::error file=$file::Could not read Compose configuration"
            else
              buildable="$(printf '%s' "$config" | python -c 'import json,sys; services=json.load(sys.stdin).get("services", {}); print("yes" if services and all("build" in service for service in services.values()) else "no")')"
              if [ "$buildable" = "yes" ]; then
                if ! docker compose -f "$file" up -d --build --wait --wait-timeout 90; then
                  failed=1
                  echo "::error file=$file::Compose services did not start and become ready"
                  docker compose -f "$file" ps
                  docker compose -f "$file" logs --no-color
                fi
              else
                echo "::notice file=$file::Runtime check skipped because this project uses prebuilt images without local build contexts"
                if ! docker compose -f "$file" build; then
                  failed=1
                  echo "::error file=$file::Compose build failed"
                fi
              fi
            fi
            docker compose -f "$file" down --volumes --remove-orphans
            echo "::endgroup::"
          done < <(find . \( -name docker-compose.yml -o -name docker-compose.yaml -o -name compose.yml -o -name compose.yaml \) -print0)
          exit "$failed"
