name: CI réutilisable

on:
  workflow_call:
    inputs:
      polycyber:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detection:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.challenges.outputs.matrix }}
      count: ${{ steps.challenges.outputs.count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: challenges
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pep28/PolyPwnCTF-2026-Challenges
          ref: 4282db2c05367eef442d1af297e1440f9a81fa96
          path: ci
          persist-credentials: false
      - id: challenges
        run: python ci/scripts/discover.py

  challenge:
    needs: detection
    if: needs.detection.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        chemin: ${{ fromJSON(needs.detection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: challenges
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pep28/PolyPwnCTF-2026-Challenges
          ref: 4282db2c05367eef442d1af297e1440f9a81fa96
          path: ci
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - name: Vérifier le challenge
        env:
          CHEMIN: ${{ matrix.chemin }}
          POLYCYBER: ${{ inputs.polycyber }}
        run: python ci/scripts/challenge.py

  resultat:
    if: always()
    needs: [detection, challenge]
    runs-on: ubuntu-latest
    steps:
      - env:
          DETECTION: ${{ needs.detection.result }}
          CHALLENGE: ${{ needs.challenge.result }}
        run: |
          if [ "$DETECTION" != success ] || { [ "$CHALLENGE" != success ] && [ "$CHALLENGE" != skipped ]; }; then
            exit 1
          fi
