services:
  db:
    image: catlab-ci-db
    build:
      context: ./db

  web:
    image: catlab-ci-web
    build:
      context: .
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/index.php\") === false ? 1 : 0);'"]
      interval: 3s
      timeout: 3s
      retries: 30
