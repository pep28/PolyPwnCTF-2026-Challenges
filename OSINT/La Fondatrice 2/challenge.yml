name: "La Fondatrice 2"
author: F1b0n4cc1
category: OSINT

type: standard
value: 6

description: |-
  ## Description (français)

  Merci de votre aide! <br>
  Nous avons eu accès à des archives du laboratoires au nom de M.H., qui contenaient un vieil objet fin et circulaire, ayant appartenu à la fondatrice. Nos historiens ont nommé cela un "CD", et ont réussi à ressortir de l'audio de cette relique! Mais elle contient une sorte de musique difficile à entendre derrière une foule. <br>
  Seriez-vous capable de déterminer le nom de la pièce musicale ainsi que son auteur? Cela nous rapprochera de l'identité de la fondatrice.

  (Format: "nompieceprenomnommusicien" , sans accents, ponctuation, ni espaces, dans la langue d'origine)

  ## Description (english)

  Thank you for your help! <br>
  We gained access to the laboratory archives under the name M.H., which contained an old, thin, circular object that belonged to the founder. Our historians named it a “CD” and managed to extract audio from this relic! But it contains a kind of music that is difficult to hear over the ambient noises. <br>
  Would you be able to determine the name of the piece of music and its author? This will bring us closer to the identity of the founder.

  (Format: "musicnamefirstnamelastname", without accents, punctuation, nor spaces, in its original language)

files:
  - ./files/mystery_music.mp3

